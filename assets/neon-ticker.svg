<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" role="img" aria-labelledby="title desc">
  <title id="title">Neil Bauman builder transmission</title>
  <desc id="desc">An animated neon ticker cycles through building useful AI systems, shipping full-stack products, and bridging software with hardware. Reduced-motion mode shows a static summary.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .message{opacity:0;animation:signal-cycle 12s steps(1,end) infinite}.m2{animation-delay:3s}.m3{animation-delay:6s}.m4{animation-delay:9s}.cursor{animation:blink 1s steps(1,end) infinite}.static{display:none}
    @keyframes signal-cycle{0%,24.9%{opacity:1}25%,100%{opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
    @media (prefers-reduced-motion:reduce){.message,.cursor{display:none;animation:none}.static{display:inline}}
  </style>
  <rect x="1" y="1" width="898" height="56" rx="8" fill="#080611" stroke="#8B5CF6" stroke-opacity=".6"/>
  <path d="M18 29h116l14-11h52M700 18h52l14 11h116" fill="none" stroke="#8B5CF6" stroke-opacity=".7"/>
  <circle cx="200" cy="18" r="3" fill="#FF2BD6" filter="url(#glow)"/>
  <circle cx="700" cy="18" r="3" fill="#00F0FF" filter="url(#glow)"/>
  <g fill="#D9FF3F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.8" text-anchor="middle" filter="url(#glow)">
    <text class="message m1" x="450" y="36">BOOTING USEFUL AI SYSTEMS...</text>
    <text class="message m2" x="450" y="36">SHIPPING FULL-STACK PRODUCTS...</text>
    <text class="message m3" x="450" y="36">BRIDGING SOFTWARE // HARDWARE...</text>
    <text class="message m4" x="450" y="36">SIGNAL LOCKED // LET'S BUILD.</text>
    <text class="static" x="450" y="36">AI SYSTEMS // FULL-STACK // EMBEDDED</text>
  </g>
  <rect class="cursor" x="674" y="21" width="8" height="20" fill="#00F0FF" filter="url(#glow)"/>
</svg>
