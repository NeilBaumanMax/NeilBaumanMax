<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Neil Bauman neon signal header</title>
  <desc id="desc">Cyberpunk broadcast panel introducing Neil Bauman and his work across AI systems, full-stack products, and embedded intelligence.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#F4F1FF" stroke-opacity=".035"/>
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity=".7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="magentaGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#FF2BD6" flood-opacity=".62" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ghost-c{animation:glitch-c 4.8s steps(1,end) infinite}.ghost-m{animation:glitch-m 4.8s steps(1,end) infinite}.cursor{animation:blink 1.1s steps(1,end) infinite}
    @keyframes glitch-c{0%,86%,100%{transform:translate(0)}88%{transform:translate(8px,-2px)}90%{transform:translate(-3px,1px)}92%{transform:translate(0)}}
    @keyframes glitch-m{0%,84%,100%{transform:translate(0)}86%{transform:translate(-7px,2px)}89%{transform:translate(4px,-1px)}92%{transform:translate(0)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.15}}
    @media (prefers-reduced-motion:reduce){.ghost-c,.ghost-m,.cursor{animation:none}}
  </style>

  <rect x="4" y="4" width="992" height="272" rx="16" fill="#080611" stroke="url(#edge)" stroke-width="2"/>
  <path d="M22 56V22h34M944 22h34v34M22 224v34h34M944 258h34v-34" fill="none" stroke="#D9FF3F" stroke-width="3"/>
  <path d="M43 76H172l22-22h118M688 54h131l18 22h120M42 220h214l22 18h168M650 238h154l22-18h131" fill="none" stroke="#8B5CF6" stroke-opacity=".55"/>
  <circle cx="172" cy="76" r="4" fill="#00F0FF" filter="url(#cyanGlow)"/>
  <circle cx="837" cy="76" r="4" fill="#FF2BD6" filter="url(#magentaGlow)"/>
  <circle cx="446" cy="238" r="4" fill="#D9FF3F"/>
  <rect x="5" y="5" width="990" height="270" rx="15" fill="url(#scanlines)"/>

  <text x="45" y="50" fill="#D9FF3F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3">SIGNAL://NEIL_BAUMAN</text>
  <text x="955" y="50" text-anchor="end" fill="#B8ADD2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">CHANNEL 0X01 // ONLINE</text>

  <g font-family="Arial Black, Impact, sans-serif" font-size="92" font-weight="900" letter-spacing="-4">
    <text class="ghost-c" x="47" y="165" fill="#00F0FF" opacity=".72" filter="url(#cyanGlow)">NEIL BAUMAN</text>
    <text class="ghost-m" x="39" y="171" fill="#FF2BD6" opacity=".7" filter="url(#magentaGlow)">NEIL BAUMAN</text>
    <text x="43" y="168" fill="#F4F1FF">NEIL BAUMAN</text>
  </g>

  <rect x="45" y="190" width="12" height="12" fill="#FF2BD6"/>
  <text x="68" y="201" fill="#00F0FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">AI SYSTEMS</text>
  <text x="206" y="201" fill="#8B5CF6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">//</text>
  <text x="236" y="201" fill="#D9FF3F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">FULL-STACK PRODUCTS</text>
  <text x="466" y="201" fill="#8B5CF6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">//</text>
  <text x="496" y="201" fill="#FF2BD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">EMBEDDED INTELLIGENCE</text>
  <rect class="cursor" x="743" y="186" width="10" height="18" fill="#00F0FF" filter="url(#cyanGlow)"/>

  <text x="45" y="250" fill="#B8ADD2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">BUILD USEFUL THINGS // CROSS THE BOUNDARY // SHIP THE SIGNAL</text>
  <text x="955" y="250" text-anchor="end" fill="#FF2BD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">GLOBAL // NETWORK ACTIVE</text>
</svg>
